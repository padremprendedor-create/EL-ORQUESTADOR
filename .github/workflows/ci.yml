# CI de EL-ORQUESTADOR.
#
# QUE SE PUEDE PROBAR AQUI Y QUE NO
#   Este repositorio son instrucciones para un agente. Si de verdad funcionan
#   —si el metodo produce mejores rondas— no lo puede decir un runner: eso se
#   mide usandolo, y el propio README trae el presupuesto de una ronda real
#   justo porque no hay forma barata de saberlo.
#
#   Lo que si cabe aqui es lo que rompe EN SILENCIO, que es lo peligroso de un
#   repo sin build: una skill que no se llama como su carpeta (Claude Code no la
#   encuentra y no avisa), una plantilla que se nombra y no esta (el agente se la
#   inventa, que es peor que fallar), o —desde que esto es un plugin— una skill
#   que manda usar un agente que el plugin no trae, y un manifiesto que apunta a
#   una carpeta inexistente: entonces no falla una skill, no se instala nada.
#
# Sin dependencias: Node a secas. Anadir un package.json para esto seria mas
# superficie que valor.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  skills:
    name: manifiestos, agentes, nombres y rutas
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Comprobar el plugin
        run: node scripts/check-skills.mjs
